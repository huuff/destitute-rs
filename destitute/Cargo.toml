[package]
name = "destitute"
description = "Derive an all-optional twin of any struct, with fallible promotion back"
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `#[destitute(serde)]`: derive Serialize/Deserialize on the generated types, with
# missing optional fields defaulting to `None` and an untagged either-or enum.
serde = ["dep:serde", "destitute-derive/serde"]

[dependencies]
destitute-derive = { version = "0.1.0", path = "../destitute-derive" }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
