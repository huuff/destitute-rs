[package]
name = "destitute-derive"
description = "Proc-macro implementation for the `destitute` crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[features]
# Enables `#[destitute(serde)]`. Turn on via the `serde` feature of `destitute`.
serde = []

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
